<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Swipe Through College (mockup)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1d1a; --bg2: #13403a; --ink: #ffffff; --muted: #a9c2bb;
    --lime: #b6f36a; --pink: #ff5ca8; --sky: #4cc9ff; --sun: #ffd23f; --red: #ff5a5f;
    --card: #fffaf0; --card-ink: #1a1033;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow-x: clip; }
  body {
    background: radial-gradient(120% 80% at 50% 0%, var(--bg2), var(--bg) 70%);
    color: var(--ink);
    font: 600 17px/1.35 "Bricolage Grotesque", system-ui, sans-serif;
    overflow: hidden;
  }
  .stage { max-width: 480px; margin: 0 auto; height: 100%; padding: 14px 16px 18px; display: flex; flex-direction: column; }
  button { font: inherit; color: inherit; border: 0; cursor: pointer; }
  :focus-visible { outline: 3px solid var(--sun); outline-offset: 3px; }

  /* Meters */
  .meters { display: grid; grid-template-columns: repeat(3, 1fr) 1.3fr; gap: 8px; }
  .meter { background: rgba(255,255,255,.07); border-radius: 14px; padding: 8px 8px 10px; text-align: center; position: relative; }
  .meter .ic { font-size: 20px; display: block; }
  .meter .lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
  .bar { height: 7px; background: rgba(255,255,255,.12); border-radius: 99px; overflow: hidden; margin-top: 5px; }
  .bar i { display: block; height: 100%; background: var(--lime); border-radius: 99px; transition: width .5s cubic-bezier(.3,1.4,.5,1), background .3s; }
  .bar i.low { background: var(--red); }
  .dot { position: absolute; top: -5px; left: 50%; transform: translateX(-50%); width: 10px; height: 10px; border-radius: 50%; background: #fff; opacity: 0; transition: opacity .15s, width .15s, height .15s; }
  .dot.show { opacity: 1; } .dot.big { width: 16px; height: 16px; top: -8px; }
  .meter.bump { animation: bump .45s; }
  .debt { background: rgba(255,90,95,.12); }
  .debt .num { font-size: 20px; font-weight: 800; color: #ffb3b5; font-variant-numeric: tabular-nums; display: block; line-height: 1.2; margin-top: 3px; }

  .chapter { text-align: center; color: var(--muted); font-size: 14px; margin: 14px 0 6px; letter-spacing: .04em; }
  .chapter b { color: var(--sun); }

  /* Card deck */
  .deck { position: relative; flex: 1; min-height: 340px; margin: 6px 0 12px; }
  .stage { overflow-x: clip; overflow-y: visible; }
  .under { position: absolute; inset: 14px 10px -6px; background: rgba(255,255,255,.12); border-radius: 26px; transform: rotate(-2deg); }
  .card {
    position: absolute; inset: 0; background: var(--card); color: var(--card-ink);
    border-radius: 26px; box-shadow: 0 18px 40px rgba(0,0,0,.4);
    display: flex; flex-direction: column; padding: 20px; touch-action: none; user-select: none;
    cursor: grab; will-change: transform;
  }
  .card.enter { animation: deal .35s cubic-bezier(.2,1.3,.4,1); }
  .card .who { display: flex; align-items: center; gap: 10px; font-size: 15px; color: #6a5f8c; }
  .card .avatar { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-size: 22px; background: #efe7ff; }
  .card .art { flex: 1; display: grid; place-items: center; font-size: clamp(84px, 26vw, 120px); line-height: 1; }
  .card .text { font-size: clamp(21px, 5.6vw, 25px); font-weight: 800; line-height: 1.18; }
  .card .stake { margin-top: 10px; font-size: 14px; color: #6a5f8c; font-weight: 600; }
  .choice-tag {
    position: absolute; top: 22px; padding: 8px 14px; border-radius: 12px; font-weight: 800; font-size: 18px;
    border: 3px solid; opacity: 0; max-width: 60%; line-height: 1.1; background: var(--card);
  }
  .choice-tag.l { right: 18px; color: var(--pink); border-color: var(--pink); transform: rotate(8deg); }
  .choice-tag.r { left: 18px; color: #1f9d55; border-color: #1f9d55; transform: rotate(-8deg); }

  .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .pick { border-radius: 16px; padding: 14px 10px; font-weight: 800; font-size: 16px; line-height: 1.15; min-height: 58px; }
  .pick.l { background: rgba(255,92,168,.18); color: #ffc2de; }
  .pick.r { background: rgba(182,243,106,.18); color: var(--lime); }
  .hint { text-align: center; color: var(--muted); font-size: 13px; margin-top: 8px; font-weight: 500; }

  /* Consequence popup */
  .sheet-bg { position: fixed; inset: 0; background: rgba(5,12,10,.6); z-index: 20; display: flex; align-items: flex-end; justify-content: center; animation: fade .2s; }
  .sheet {
    width: 100%; max-width: 480px; background: #fff; color: var(--card-ink); border-radius: 26px 26px 0 0;
    padding: 22px 20px calc(20px + env(safe-area-inset-bottom)); animation: up .3s cubic-bezier(.2,1.2,.4,1);
  }
  .sheet .head { display: flex; align-items: center; gap: 10px; font-size: 26px; font-weight: 800; line-height: 1.1; }
  .sheet .deltas { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0; }
  .sheet .d { border-radius: 999px; padding: 4px 10px; font-size: 14px; font-weight: 800; }
  .sheet .d.up { background: #e2f7d0; color: #2c6b0f; } .sheet .d.down { background: #ffe1e3; color: #a4161a; }
  .sheet .lesson { background: #f3eefe; border-radius: 16px; padding: 14px; font-weight: 500; font-size: 16px; }
  .sheet .lesson b { color: #5b2bd1; }
  .go { width: 100%; margin-top: 14px; background: var(--card-ink); color: #fff; padding: 16px; border-radius: 16px; font-weight: 800; font-size: 18px; }

  /* Start + end */
  .center { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 16px; text-align: center; }
  .title { font-size: clamp(48px, 14vw, 76px); font-weight: 800; line-height: .92; letter-spacing: -.03em; margin: 0; }
  .title span { color: var(--lime); }
  .demo { font-size: 72px; animation: wiggle 1.6s infinite; display: inline-block; }
  .big { background: var(--lime); color: #10301f; font-size: 22px; font-weight: 800; padding: 18px; border-radius: 18px; box-shadow: 0 6px 0 #6fae2a; width: 100%; }
  .big:active { transform: translateY(4px); box-shadow: 0 2px 0 #6fae2a; }
  .ghost { background: rgba(255,255,255,.1); padding: 14px; border-radius: 14px; width: 100%; }
  .badge { align-self: center; background: var(--sun); color: #1a1033; padding: 6px 14px; border-radius: 999px; font-weight: 800; transform: rotate(-3deg); }

  .wrapped {
    border-radius: 28px; padding: 24px 20px; text-align: left; position: relative; overflow: hidden;
    background: linear-gradient(150deg, var(--c1), var(--c2)); color: #fff; box-shadow: 0 20px 50px rgba(0,0,0,.45);
    animation: deal .6s cubic-bezier(.2,1.3,.4,1);
  }
  .wrapped .k { font-size: 13px; letter-spacing: .14em; text-transform: uppercase; opacity: .85; }
  .wrapped .emoji { font-size: 76px; line-height: 1; margin: 10px 0 4px; }
  .wrapped .type { font-size: 40px; font-weight: 800; line-height: 1; letter-spacing: -.02em; }
  .wrapped .desc { font-weight: 500; margin: 8px 0 16px; opacity: .95; }
  .wrapped .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .wrapped .stats div { background: rgba(0,0,0,.18); border-radius: 14px; padding: 10px; }
  .wrapped .stats b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
  .wrapped .stats span { font-size: 12px; opacity: .85; }
  .wrapped .brand { position: absolute; right: 18px; top: 18px; font-weight: 800; opacity: .9; }
  .note { font-size: 13px; color: var(--muted); font-weight: 500; }

  .confetti { position: fixed; top: -12px; width: 10px; height: 14px; z-index: 30; pointer-events: none; animation: fall linear forwards; }

  @keyframes deal { from { transform: translateY(40px) scale(.9); opacity: 0; } }
  @keyframes up { from { transform: translateY(100%); } }
  @keyframes fade { from { opacity: 0; } }
  @keyframes bump { 40% { transform: scale(1.12); } }
  @keyframes wiggle { 0%,100% { transform: translateX(-24px) rotate(-12deg); } 50% { transform: translateX(24px) rotate(12deg); } }
  @keyframes fall { to { transform: translateY(105vh) rotate(720deg); } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="stage" id="stage"></div>

<script>
(() => {
  // Effects: cash / vibes / grades are 0–100 meters; debt is dollars.
  const CARDS = [
    { ch: 'Senior year', who: 'School counselor', av: '🧑‍🏫', art: '📬',
      text: 'The FAFSA just opened. It’s ~30 minutes of forms. Do it now?',
      L: { label: 'Ugh, later 😴', fx: { vibes: +5 }, debt: 16000, head: 'You never got to it…',
           lesson: 'Skipping the <b>FAFSA</b> = skipping free money. It unlocks <b>grants</b>, work-study, and most school aid. You’ll borrow ~$16k more to cover it.' },
      R: { label: 'Do it now ✍️', fx: { vibes: -5, cash: +10 }, debt: 0, head: '$16,000 in grants unlocked! 🎉',
           lesson: 'Grants are <b>free money</b> you don’t pay back. Re-file the FAFSA <b>every year</b> you’re in school.' } },
    { ch: 'Senior year', who: 'Your mailbox', av: '✉️', art: '🏫',
      text: 'You got in! Dream school out-of-state ($43k/yr) or in-state ($24k/yr)?',
      stake: 'Price includes tuition + housing + food',
      L: { label: 'Dream school ✨', fx: { vibes: +15 }, debt: 45000, head: 'Living the dream… on credit',
           lesson: 'Out-of-state tuition averages <b>~2.5×</b> in-state. Check <b>net price calculators</b> and in-state honors programs before deciding.' },
      R: { label: 'In-state 🏠', fx: { vibes: -5, cash: +5 }, debt: 12000, head: 'Smart money move 🧠',
           lesson: 'Public in-state schools average about <b>$11,600/yr</b> in tuition. Same degree, way less debt.' } },
    { ch: 'Freshman year', who: 'Financial aid office', av: '🏛️', art: '🏦',
      text: 'You still need $10k this year. Federal loan at 6.39%, or the bank’s private loan at 9.5%?',
      L: { label: 'Bank loan 🏦', fx: { cash: -5 }, debt: 4200, head: 'That rate stings 😬',
           lesson: 'Higher rate = <b>~$4,200 extra</b> in interest on $10k over 10 years. Use <b>federal loans first</b> — fixed rates and safer repayment plans.' },
      R: { label: 'Federal 🏛️', fx: { cash: +5 }, debt: 0, head: 'Federal first. Correct! ✅',
           lesson: '<b>Subsidized</b> federal loans don’t even grow interest while you’re in school.' } },
    { ch: 'Freshman year', who: 'Campus café', av: '☕', art: '💼',
      text: 'We’re hiring! 10 hours a week, $15/hr.',
      L: { label: 'Nah, I’m busy', fx: { grades: +5, cash: -10 }, debt: 2000, head: 'More study time, less cash',
           lesson: 'Fair choice — but even a small job covers books and food so you <b>borrow less</b>.' },
      R: { label: 'I’ll take it 💪', fx: { cash: +20, grades: -5, vibes: -5 }, debt: -6000, head: '+$6,000 over 4 years 💸',
           lesson: 'Students working <b>~10–15 hrs/week</b> often do just as well in class. Past ~20 hrs, grades tend to slip.' } },
    { ch: 'Sophomore year', who: 'Bookstore', av: '📚', art: '📖',
      text: 'Your textbooks cost $480 new. Or rent used ones for $120.',
      L: { label: 'Buy new 🛍️', fx: { cash: -15 }, debt: 0, head: 'Shiny… and expensive',
           lesson: 'Renting, buying used, or checking the library can save <b>hundreds per semester</b>.' },
      R: { label: 'Rent used ♻️', fx: { cash: +10 }, debt: 0, head: 'Saved $360 🎯',
           lesson: 'That’s <b>$2,800+</b> saved over 4 years at this rate.' } },
    { ch: 'Sophomore year', who: 'Random table on campus', av: '🎁', art: '💳',
      text: 'Sign up for a credit card and get a FREE t-shirt + pizza!',
      L: { label: 'No thanks 🙅', fx: { vibes: -5 }, debt: 0, head: 'Dodged it',
           lesson: 'Credit cards aren’t evil — but card interest averages <b>~22–24%</b>. Only charge what you can pay off in full each month.' },
      R: { label: 'Free pizza! 🍕', fx: { vibes: +10, cash: -10 }, debt: 1800, head: 'Pizza was $1,800 😭',
           lesson: 'You carried a balance at <b>24% interest</b>. Small swipes add up fast when you only pay the minimum.' } },
    { ch: 'Junior year', who: 'Group chat 🌴', av: '💬', art: '🏖️',
      text: 'Spring break in Cancún?? It’s $1,200 each 🙏',
      L: { label: 'Can’t this year', fx: { vibes: -15, cash: +10 }, debt: 0, head: 'FOMO is real',
           lesson: 'Saying no is hard. A <b>“fun fund”</b> in your budget lets you plan trips without debt.' },
      R: { label: 'I’m in!! ✈️', fx: { vibes: +20, cash: -20 }, debt: 1200, head: 'Best week ever… on a card',
           lesson: 'Memories are worth something! Just know <b>$1,200 on a card</b> can take a year+ to pay off with minimum payments.' } },
    { ch: 'After graduation', who: 'Your first paycheck', av: '🧾', art: '🏢',
      text: 'You make $3,600/month. Live alone ($1,500) or with a roommate ($900)?',
      L: { label: 'Solo life 👑', fx: { vibes: +10, cash: -20 }, debt: 0, head: 'Your own space!',
           lesson: 'Rent at <b>42%</b> of your pay is tight. Try to keep housing under <b>~35%</b>.' },
      R: { label: 'Roommate 🤝', fx: { cash: +20, vibes: -5 }, debt: 0, head: '$600/month freed up 💰',
           lesson: 'That’s <b>$7,200 a year</b> you can save or put toward loans.' } },
    { ch: 'After graduation', who: 'Your bank app', av: '📱', art: '🐷',
      text: 'Auto-save 20% of every paycheck?',
      L: { label: 'Spend it 💅', fx: { vibes: +10, cash: -20 }, debt: 0, head: 'Living for today',
           lesson: 'The <b>50/30/20 rule</b>: 50% needs, 30% wants, <b>20% savings</b>. Even 10% is a great start.' },
      R: { label: 'Auto-save ✅', fx: { cash: +25 }, debt: -3000, head: 'Future you says thanks 🙏',
           lesson: 'Automatic saving works because you <b>never see the money</b>. Some extra goes toward your loans too.' } },
    { ch: 'Plot twist', who: 'Your car', av: '🚗', art: '💥',
      text: 'Surprise! Your car needs a $1,200 repair.',
      emergency: true },
  ];

  const START = { cash: 50, vibes: 60, grades: 70, debt: 0 };
  const $stage = document.getElementById('stage');
  let st, idx, history;

  const money = (n) => '$' + Math.round(n).toLocaleString();
  const clamp = (n) => Math.max(0, Math.min(100, n));

  function confetti(n = 80) {
    const colors = ['#b6f36a', '#ff5ca8', '#4cc9ff', '#ffd23f', '#ffffff'];
    for (let k = 0; k < n; k++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = Math.random() * 100 + 'vw';
      c.style.background = colors[k % colors.length];
      c.style.animationDuration = 1.6 + Math.random() * 1.6 + 's';
      c.style.animationDelay = Math.random() * .4 + 's';
      c.style.borderRadius = Math.random() > .5 ? '50%' : '2px';
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 3800);
    }
  }
  const buzz = () => { try { navigator.vibrate && navigator.vibrate(60); } catch {} };

  // Emergency card resolves based on savings.
  function emergencyChoices() {
    const canPay = st.cash >= 45;
    return {
      L: { label: 'Credit card 💳', fx: { vibes: -5 }, debt: 1500, head: 'On the card at 24%… 😬',
           lesson: 'With interest, that $1,200 will cost you <b>~$1,500</b>. An <b>emergency fund</b> (3–6 months of expenses) turns a crisis into a shrug.' },
      R: canPay
        ? { label: 'Emergency fund 🛟', fx: { cash: -20 }, debt: 0, head: 'Handled it. No stress. 😎',
            lesson: 'This is exactly what an <b>emergency fund</b> is for. Your savings habits paid off!' }
        : { label: 'Emergency fund 🛟', fx: { vibes: -10 }, debt: 1500, head: 'Not enough saved… 💀',
            lesson: 'Your savings were too low, so it went on a card anyway. Aim to save <b>a little every paycheck</b> for surprises like this.' },
    };
  }

  // ---- Screens ----
  function start() {
    st = { ...START }; idx = 0; history = [];
    $stage.innerHTML = `
      <div class="center">
        <span class="badge">centsible. presents</span>
        <h1 class="title">Swipe<br>through<br><span>college.</span></h1>
        <div><span class="demo" aria-hidden="true">👆</span></div>
        <p style="color:var(--muted);font-weight:500;margin:0">10 choices. Senior year → first job.<br>Keep your 💰 📚 😊 up and your debt down.</p>
        <button class="big" id="go">Start swiping →</button>
      </div>`;
    document.getElementById('go').onclick = deal;
  }

  function meters(preview) {
    const m = (k, ic, lbl) => {
      const v = st[k], fx = preview && preview[k];
      return `<div class="meter" id="m_${k}">
        <span class="dot ${fx ? 'show' : ''} ${fx && Math.abs(fx) >= 15 ? 'big' : ''}"></span>
        <span class="ic" aria-hidden="true">${ic}</span><span class="lbl">${lbl}</span>
        <div class="bar" role="meter" aria-label="${lbl}" aria-valuenow="${v}" aria-valuemin="0" aria-valuemax="100"><i class="${v <= 25 ? 'low' : ''}" style="width:${v}%"></i></div>
      </div>`;
    };
    return `<div class="meters" id="meters">
      ${m('cash', '💰', 'Cash')}${m('grades', '📚', 'Grades')}${m('vibes', '😊', 'Vibes')}
      <div class="meter debt"><span class="lbl">Debt</span><span class="num" id="debt">${money(st.debt)}</span></div>
    </div>`;
  }
  function updateMeterDots(fx) {
    ['cash', 'grades', 'vibes'].forEach((k) => {
      const dot = document.querySelector(`#m_${k} .dot`);
      const v = fx && fx[k];
      dot.classList.toggle('show', !!v);
      dot.classList.toggle('big', !!v && Math.abs(v) >= 15);
    });
  }

  function deal() {
    const C = CARDS[idx];
    if (C.emergency) Object.assign(C, emergencyChoices());
    $stage.innerHTML = `
      ${meters()}
      <div class="chapter"><b>${C.ch}</b> · card ${idx + 1} of ${CARDS.length}</div>
      <div class="deck">
        ${idx < CARDS.length - 1 ? '<div class="under"></div>' : ''}
        <div class="card enter" id="card" tabindex="0" aria-describedby="cardText">
          <div class="who"><span class="avatar" aria-hidden="true">${C.av}</span>${C.who}</div>
          <div class="art" aria-hidden="true">${C.art}</div>
          <div class="text" id="cardText">${C.text}</div>
          ${C.stake ? `<div class="stake">${C.stake}</div>` : ''}
          <span class="choice-tag l" id="tagL">${C.L.label}</span>
          <span class="choice-tag r" id="tagR">${C.R.label}</span>
        </div>
      </div>
      <div class="btns">
        <button class="pick l" id="pickL">◀ ${C.L.label}</button>
        <button class="pick r" id="pickR">${C.R.label} ▶</button>
      </div>
      <div class="hint">Swipe the card, tap a button, or use ← →</div>`;
    bindSwipe(C);
  }

  function bindSwipe(C) {
    const card = document.getElementById('card');
    const tagL = document.getElementById('tagL'), tagR = document.getElementById('tagR');
    let x0 = null, dx = 0, done = false;

    const paint = () => {
      card.style.transform = `translateX(${dx}px) rotate(${dx / 18}deg)`;
      const p = Math.min(1, Math.abs(dx) / 100);
      tagL.style.opacity = dx < 0 ? p : 0;
      tagR.style.opacity = dx > 0 ? p : 0;
      updateMeterDots(Math.abs(dx) > 30 ? (dx < 0 ? C.L.fx : C.R.fx) : null);
    };
    const commit = (side) => {
      if (done) return; done = true;
      const dir = side === 'L' ? -1 : 1;
      card.style.transition = 'transform .35s ease-in';
      card.style.transform = `translateX(${dir * 600}px) rotate(${dir * 30}deg)`;
      (side === 'L' ? tagL : tagR).style.opacity = 1;
      document.removeEventListener('keydown', onKey);
      setTimeout(() => apply(C, side), 260);
    };
    const onKey = (e) => {
      if (e.key === 'ArrowLeft') commit('L');
      if (e.key === 'ArrowRight') commit('R');
    };

    card.addEventListener('pointerdown', (e) => { x0 = e.clientX; card.setPointerCapture(e.pointerId); card.style.transition = 'none'; card.style.cursor = 'grabbing'; });
    card.addEventListener('pointermove', (e) => { if (x0 === null) return; dx = e.clientX - x0; paint(); });
    const release = () => {
      if (x0 === null) return;
      x0 = null; card.style.cursor = '';
      if (Math.abs(dx) > 100) return commit(dx < 0 ? 'L' : 'R');
      card.style.transition = 'transform .3s cubic-bezier(.2,1.4,.4,1)';
      dx = 0; paint();
    };
    card.addEventListener('pointerup', release);
    card.addEventListener('pointercancel', release);
    document.getElementById('pickL').onclick = () => commit('L');
    document.getElementById('pickR').onclick = () => commit('R');
    ['pickL', 'pickR'].forEach((id) => {
      const b = document.getElementById(id), C2 = id === 'pickL' ? C.L : C.R;
      b.onmouseenter = b.onfocus = () => updateMeterDots(C2.fx);
      b.onmouseleave = b.onblur = () => updateMeterDots(null);
    });
    document.addEventListener('keydown', onKey);
  }

  function apply(C, side) {
    const ch = C[side];
    const before = { ...st };
    Object.entries(ch.fx).forEach(([k, v]) => { st[k] = clamp(st[k] + v); });
    st.debt = Math.max(0, st.debt + ch.debt);
    history.push({ card: idx, side });

    // Animate meters
    const tmp = document.createElement('div'); tmp.innerHTML = meters();
    document.getElementById('meters').replaceWith(tmp.firstElementChild);
    ['cash', 'grades', 'vibes'].forEach((k) => {
      if (st[k] !== before[k]) {
        const el = document.getElementById('m_' + k);
        const bar = el.querySelector('.bar i');
        bar.style.width = before[k] + '%';
        requestAnimationFrame(() => requestAnimationFrame(() => { bar.style.width = st[k] + '%'; }));
        el.classList.add('bump');
      }
    });

    const good = (ch.debt <= 0) && Object.values(ch.fx).reduce((a, b) => a + b, 0) >= 0;
    if (good) confetti(30); else buzz();

    const deltas = [
      ...Object.entries(ch.fx).map(([k, v]) => `<span class="d ${v > 0 ? 'up' : 'down'}">${{ cash: '💰', grades: '📚', vibes: '😊' }[k]} ${v > 0 ? '+' : ''}${v}</span>`),
      ch.debt ? `<span class="d ${ch.debt < 0 ? 'up' : 'down'}">Debt ${ch.debt > 0 ? '+' : '−'}${money(Math.abs(ch.debt))}</span>` : '',
    ].join('');

    const bg = document.createElement('div');
    bg.className = 'sheet-bg';
    bg.innerHTML = `<div class="sheet" role="dialog" aria-live="assertive">
      <div class="head">${ch.head}</div>
      <div class="deltas">${deltas}</div>
      <div class="lesson">💡 ${ch.lesson}</div>
      <button class="go" id="cont">${idx + 1 < CARDS.length ? 'Next card →' : 'See my money personality ✨'}</button>
    </div>`;
    document.body.appendChild(bg);
    const cont = document.getElementById('cont');
    cont.focus();
    cont.onclick = () => {
      bg.remove();
      const broke = ['cash', 'grades', 'vibes'].find((k) => st[k] <= 0);
      idx++;
      if (broke || idx >= CARDS.length) end(broke); else deal();
    };
  }

  function personality() {
    const fafsa = history.find((h) => h.card === 0)?.side === 'R';
    if (st.debt <= 15000 && st.cash >= 70) return { e: '🐿️', t: 'The Squirrel', d: 'You stash nuts for winter. Low debt, big savings — future you is thriving.', c1: '#1f9d55', c2: '#0f5c8c' };
    if (fafsa && st.debt <= 25000) return { e: '🏆', t: 'The Aid Hunter', d: 'You find every free dollar out there. Grants? Scholarships? You got ’em.', c1: '#7b2ff7', c2: '#2f6fe0' };
    if (st.vibes >= 70 && st.debt > 30000) return { e: '🎰', t: 'The YOLO', d: 'You lived your best life… and your loan servicer will be in touch. 📬', c1: '#ff3d6e', c2: '#ff7a18' };
    if (st.grades >= 75) return { e: '📚', t: 'The Scholar', d: 'Grades first, always. Now let’s get the money side as strong as your GPA.', c1: '#2f6fe0', c2: '#14b8a6' };
    return { e: '🧮', t: 'The Balancer', d: 'A little fun, a little saving. Some wins, some lessons — that’s real life.', c1: '#e3a008', c2: '#e8304f' };
  }

  function end(broke) {
    const p = personality();
    const brokeMsg = broke ? `<p style="margin:0;color:#ffb3b5">Your ${{ cash: '💰 cash', grades: '📚 grades', vibes: '😊 vibes' }[broke]} hit zero — game over early!</p>` : '';
    $stage.style.overflowY = 'auto';
    $stage.innerHTML = `
      <div class="center" style="justify-content:flex-start;padding-top:8px">
        ${brokeMsg}
        <div class="wrapped" style="--c1:${p.c1};--c2:${p.c2}" id="share-card">
          <span class="brand">centsible.</span>
          <div class="k">My money personality</div>
          <div class="emoji" aria-hidden="true">${p.e}</div>
          <div class="type">${p.t}</div>
          <div class="desc">${p.d}</div>
          <div class="stats">
            <div><b>${money(st.debt)}</b><span>Student debt</span></div>
            <div><b>${st.cash}</b><span>💰 Cash</span></div>
            <div><b>${st.vibes}</b><span>😊 Vibes</span></div>
          </div>
        </div>
        <button class="big" id="share">Share to my story 📲</button>
        <button class="ghost" id="again">Play again 🔁</button>
        <p class="note">Mockup: sharing would create an image of this card for Instagram/TikTok stories.</p>
      </div>`;
    confetti(120);
    document.getElementById('again').onclick = () => { $stage.style.overflowY = ''; start(); };
    document.getElementById('share').onclick = async () => {
      const text = `I’m ${p.e} ${p.t} on Centsible’s Swipe Through College. What are you?`;
      try { if (navigator.share) await navigator.share({ text }); else { await navigator.clipboard.writeText(text); alert('Copied!'); } } catch {}
    };
  }

  start();
})();
</script>
</body>
</html>
